    AuditErrorResponse:
      type: object
      description: >-
        Shared error envelope used across the System Audit Logs service
        (HttpExceptionFilter / ValidationExceptionFilter) — same shape for every
        4xx/5xx from that service.
      properties:
        statusCode:
          type: integer
        name:
          type: string
        errors:
          type: array
          items:
            type: object
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          nullable: true

    # --- Corporate Validations Orchestration ---
    CorporateValidationsResponse:
      type: object
      description: >
        Result of the eligibility and limits check. Returned with HTTP 200 whenever
        an eligibility determination could be made — see operation description for
        details.
      required:
        - eligible
      properties:
        eligible:
          type: boolean
          description: Whether the caller is eligible for the requested module_slug.
          example: true
        reason:
          type: string
          nullable: true
          description: >
            Reason code from the eligibility check. Eligible: APPROVER_AVAILABLE, SOLE_PROPRIETOR,
            SINGLE_MANAGER or NO_WATHIQ_MAPPING. Not eligible: NO_INITIATE_PERMISSION or
            NO_APPROVER_AVAILABLE. MOI refund duplicates: REFUND_ALREADY_IN_REVIEW or
            REFUND_ALREADY_COMPLETED.
          example: APPROVER_AVAILABLE
        limits:
          description: >
            Corporate limit details for module_slug. null when eligible is false;
            when module_slug has no limits concept (e.g. a beneficiary module); or
            when eligible is true but the limits lookup failed (see limitsError).
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CorporateLimits'
        limitsError:
          type: string
          description: >
            Present only when eligible is true but the best-effort limits lookup
            failed. Does not affect the HTTP status of this response.
          example: "Request failed with status code 422"
        existing_request:
          $ref: '#/components/schemas/MoiRefundExistingRequest'

    CorporateLimits:
      type: object
      description: >
        The corporate's limit for module_slug for today (amounts in SAR). amount_left =
        max_limit - utilised_amount. Other fields may also be present; use the ones below.
      properties:
        customer_id:
          type: string
          description: Corporate (customer) id.
        module_id:
          type: string
          description: AION module id for module_slug.
        utilised_limit_date:
          type: string
          format: date
          description: The day the utilisation applies to.
        min_limit:
          type: number
        max_limit:
          type: number
          description: Daily limit.
        per_transaction_limit:
          type: number
          description: Maximum amount per transaction.
        transaction_limit:
          type: number
          description: Same value as per_transaction_limit.
        utilised_amount:
          type: number
          description: Amount already used today.
        utilised_no_transactions:
          type: integer
          description: Number of transactions made today.
        amount_left:
          type: number
          description: Amount still available today.

    CorporateValidationsErrorResponse:
      type: object
      description: Error envelope returned when eligibility cannot be determined.
      properties:
        statusCode:
          type: integer
        name:
          type: string
        errors:
          description: Exception detail payload (shape varies by exception type).
        timestamp:
          type: string
          format: date-time
        path:
          type: string
