openapi: 3.0.3
info:
  title: AION Unified API — Partner & Internal Integration
  version: "1.2.0"
  description: |
    Unified specification for AION's cross-service integration APIs, merged from
    previously separate documents:

    1. **Vision Bank Integration (V2)** — Reference Beneficiary / Reference Transfer /
       Reference Bill Payment / User Access Profile.
    2. **System Audit Logs** — centralized audit trail write API.
    3. **Corporate Validations Orchestration** — single call that returns whether a
       corporate customer is eligible to initiate a money transfer and, if so, their
       current transfer limits.
    4. **MOI Refund (Vision Bank)** — start an MOI government bill refund for
       maker-checker approval and read its status.

    ## Common request headers

    Every operation in this document expects the same header contract, regardless of
    which backing service handles it:

    | Header             | Required | Purpose                                                            |
    |---------------------|----------|---------------------------------------------------------------------|
    | `X-Access-Token`    | Yes      | Downstream access token, forwarded as-is to internal federated services. |
    | `X-Correlation-ID`  | No       | Trace id propagated across services for request tracing. Recommended on every call. |
    | `X-Device-ID`       | No       | Identifier of the calling device, where applicable.                 |
    | `X-Requester-Lang`  | No       | Preferred language (`en` / `ar`) used to localize error messages.   |

    All operations require a `bearerAuth` JWT (`Authorization: Bearer <JWT>`) unless
    individually noted. What that JWT represents still varies by operation — a
    trusted external caller's own token for Vision Bank endpoints vs. an end-user
    session token elsewhere — see each operation's description for specifics.

    ## Reference Beneficiary / Reference Transfer flow (Vision Bank)

    Single-call APIs for a trusted external system to create and immediately submit a
    beneficiary or a money transfer for maker-checker approval.

    1. AION validates the caller's token and resolves `module_slug` against that
       caller's own entitled modules (never trusts a caller-supplied module ID).
    2. AION calls back into the external system's own API (via AION's integration
       layer) using the supplied `reference_id` to fetch full record details.
    3. AION creates the draft record internally.
    4. AION immediately initiates the approval workflow (same workflow engine used
       by AION's own web/mobile channels). No OTP and no IVR for any beneficiary or
       transfer type — the caller has already verified the customer.
    5. AION returns a minimal response — the caller already holds the full record on
       its own side.

    ## MOI Refund flow (Vision Bank)

    1. **SME Validations** (`module_slug=moi-refund`) — when the user clicks *Request Refund*:
       can the user initiate a refund, the corporate limits, and whether a refund for the same
       payment already exists (pass `end_to_end_identification`).
    2. **Start MOI Refund Workflow** — after the consent is created and the user's OTP is
       verified. AION fetches the consent by `reference_id` and starts the approval workflow.
       - Single-owner company: the refund is executed during this call; the response carries
         the final status.
       - Otherwise: `AWAITING_AUTHORIZATION`. On final approval AION calls Vision Bank's
         execute API with APPROVED; if an approver rejects, AION sends REJECTED.
    3. **Get MOI Refund Workflow Status** — AION's current status for a refund.

  contact:
    name: AION Digital Engineering

servers:
  - url: https://{host}
    description: >-
      Shared API gateway host. Each path below already includes its own service
      prefix (e.g. /api/v2/..., /v1/user/..., /audit/..., /api/v1/orchestration/...).
    variables:
      host:
        default: vbksa.com

security:
  - bearerAuth: []

tags:
  - name: Reference Beneficiary Workflow
    description: Beneficiary management service — single-call beneficiary creation + workflow initiation.
  - name: Reference Transfer Workflow
    description: Money transfer service — single-call transfer creation + workflow initiation.
  - name: Reference Bill Payment Workflow
    description: Bill payment service — single-call bill payment creation + workflow initiation.
  - name: Reference MOI Refund Workflow
    description: Bill payment service — MOI government bill refund workflow initiation and status.
  - name: User Access Profile
    description: Entitlement service — user roles, modules, and permissions lookup.
  - name: System Audit Logs
    description: Centralized audit trail write API.
  - name: Corporate Validations Orchestration

paths:
  /api/v2/beneficiary-management/work-flow-process:
    post:
      tags: [Reference Beneficiary Workflow]
      summary: Create and immediately initiate a beneficiary workflow
      description: >
        This API will be used to initiate the workflow for the beneficiary creation. X-Access-Token token is a trusted
        Forgerock token (Vision Bank) which is user JWT received from API Gateway.
      operationId: initiateReferenceBeneficiary
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAccessToken'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequesterLang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceBeneficiaryInitiateRequest'
            examples:
              local:
                summary: Local beneficiary
                value:
                  module_slug: beneficiary_management-local_beneficiary
                  reference_id: VBANK-BENE-LOCAL-001
              internal:
                summary: Internal beneficiary
                value:
                  module_slug: beneficiary_management-internal_beneficiary
                  reference_id: VBANK-BENE-INTERNAL-001
      responses:
        '200':
          description: >
            Draft created and workflow initiated — no OTP, no IVR for any beneficiary
            type. Status reflects the outcome after workflow start
            (e.g. APPROVED for an auto-approved request, AWAITING_AUTHORIZATION if it
            needs a maker-checker approval).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceBeneficiaryResponse'
              example:
                reference_id: VBANK-BENE-BROKERAGE-001
                id: 2D4FC6C8-0D5F-4208-BE4C-161BD2EE7223
                module_slug: beneficiary_management-brokerage_beneficiary
                status: AWAITING_AUTHORIZATION
        '400':
          description: module_slug is missing, malformed, or not one of the currently supported types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionBankErrorResponse'
              example:
                statusCode: 400
                message: "Unsupported module_slug for reference transfers: some-unknown-slug"
                error: Bad Request
        '403':
          description: The caller's token lacks create/initiate permission on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionBankErrorResponse'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden

  /api/v2/beneficiary-management/{reference_id}/activation-status:
    put:
      tags: [Reference Beneficiary Workflow]
      summary: Finalize a reference beneficiary's activation status
      description: >
        Called by the external system (e.g. Vision Bank) once it has made its own final
        activation decision for a reference beneficiary previously initiated via
        POST work-flow-process — however it gets there (IVR or otherwise) is entirely on
        the external system's side; AION doesn't manage or model that step, it just records
        the final word.


        Only succeeds if the beneficiary is currently ACTIVATION_PENDING (i.e. AION's own
        maker-checker has already approved it and it is genuinely awaiting this final
        decision) — calling it on a record that isn't pending activation (not yet approved,
        or already finalized by a previous call) returns 404.
      operationId: updateReferenceBeneficiaryActivationStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAccessToken'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequesterLang'
        - name: reference_id
          in: path
          required: true
          description: The external system's own reference id, as originally supplied to work-flow-process.
          schema:
            type: string
          example: VBANK-BENE-LOCAL-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceBeneficiaryActivationStatusRequest'
            examples:
              approved:
                summary: Final activation approved
                value:
                  status: APPROVED
              rejected:
                summary: Final activation rejected
                value:
                  status: REJECTED
      responses:
        '200':
          description: Status finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceBeneficiaryActivationStatusResponse'
              example:
                reference_id: VBANK-BENE-LOCAL-001
                id: 2D4FC6C8-0D5F-4208-BE4C-161BD2EE7223
                status: APPROVED
        '404':
          description: >
            No beneficiary awaiting activation was found for reference_id — either AION's own
            maker-checker hasn't approved it yet, or it was already finalized by a previous call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionBankErrorResponse'
              example:
                statusCode: 404
                message: "No beneficiary awaiting activation found for reference_id=VBANK-BENE-LOCAL-001"
                error: Not Found
        '403':
          description: The caller's token lacks approve permission on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionBankErrorResponse'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden

  /api/v2/beneficiary-management/{reference_id}/workflow-status:
    get:
      tags: [Reference Beneficiary Workflow]
      summary: Get AION's current workflow status for a reference beneficiary
      description: >
        Returns AION's own application_status/process_status for a beneficiary initiated via
        POST work-flow-process — distinct from the external system's own record data. Useful
        for polling whether AION's maker-checker has approved yet, and whether the beneficiary
        is currently ACTIVATION_PENDING (awaiting the external system's own final activation
        decision via PUT activation-status).
      operationId: getReferenceBeneficiaryWorkflowStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAccessToken'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequesterLang'
        - name: reference_id
          in: path
          required: true
          description: The external system's own reference id, as originally supplied to work-flow-process.
          schema:
            type: string
          example: VBANK-BENE-LOCAL-001
      responses:
        '200':
          description: AION's current status for this reference_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceBeneficiaryWorkflowStatusResponse'
              examples:
                activationPending:
                  summary: Awaiting the external system's own final activation decision
                  value:
                    reference_id: VBANK-BENE-LOCAL-001
                    id: 2D4FC6C8-0D5F-4208-BE4C-161BD2EE7223
                    application_status: APPROVED
                    process_status: ACTIVATION_PENDING
                deletionPending:
                  summary: A deletion request is awaiting maker-checker approval
                  value:
                    reference_id: VBANK-BENE-LOCAL-001
                    id: 2D4FC6C8-0D5F-4208-BE4C-161BD2EE7223
                    application_status: APPROVED
                    process_status: DELETION_PENDING
                updationPending:
                  summary: An update request is awaiting maker-checker approval
                  value:
                    reference_id: VBANK-BENE-LOCAL-001
                    id: 2D4FC6C8-0D5F-4208-BE4C-161BD2EE7223
                    application_status: APPROVED
                    process_status: UPDATION_PENDING
                noSecondaryStatus:
                  summary: No secondary process in progress
                  value:
                    reference_id: VBANK-BENE-LOCAL-001
                    id: 2D4FC6C8-0D5F-4208-BE4C-161BD2EE7223
                    application_status: AWAITING_AUTHORIZATION
                    process_status: null
        '404':
          description: reference_id was not found for any beneficiary initiated through this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionBankErrorResponse'
              example:
                statusCode: 404
                message: "No reference beneficiary found for reference_id=VBANK-BENE-LOCAL-001"
                error: Not Found

  /api/v2/money-transfers/work-flow-process:
    post:
      tags: [Reference Transfer Workflow]
      summary: Create and immediately initiate a transfer
      description: >
        X-Access-Token token is a trusted
        Forgerock token (Vision Bank) which is user JWT received from API Gateway.
      operationId: initiateReferenceTransfer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAccessToken'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequesterLang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceTransferInitiateRequest'
            examples:
              domestic:
                summary: Domestic transfer
                value:
                  module_slug: transfer_management-domestic_bank_transfer
                  reference_id: VBANK-TRANS-DOMESTIC-001
              internal:
                summary: Internal transfer
                value:
                  module_slug: transfer_management-internal_transfer
                  reference_id: VBANK-TRANS-INTERNAL-001
      responses:
        '200':
          description: >
            Draft created and workflow initiated. Response is deliberately minimal
            (Vision Bank already holds the full record on its own side). status
            reflects the outcome after workflow start (e.g. APPROVED for
            auto-approved requests, AWAITING_AUTHORIZATION if it needs a
            maker-checker approval).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceTransferResponse'
              example:
                reference_id: VBANK-TRANS-DOMESTIC-001
                id: 11C16EA1-B3B7-4D79-8EE5-9981AEB56300
                module_slug: transfer_management-domestic_bank_transfer
                status: AWAITING_AUTHORIZATION
        '400':
          description: module_slug is missing, malformed, or not one of the currently supported types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionBankErrorResponse'
              example:
                statusCode: 400
                message: "Unsupported module_slug for reference transfers: some-unknown-slug"
                error: Bad Request
        '403':
          description: The caller's token lacks initiate permission on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionBankErrorResponse'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden

  /api/v2/bill-payments/work-flow-process:
    post:
      tags: [Reference Bill Payment Workflow]
      summary: Create and immediately initiate a bill payment
      description: >
        X-Access-Token token is a trusted
        Forgerock token (Vision Bank) which is user JWT received from API Gateway.
      operationId: initiateReferenceBillPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAccessToken'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequesterLang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceBillPaymentInitiateRequest'
            examples:
              sadad:
                summary: SADAD Bill payment
                value:
                  module_slug: bill-payment-sadad
                  reference_id: VBANK-BILL-001
              moi:
                summary: MOI Bill payment
                value:
                  module_slug: bill-payment-moi
                  reference_id: VBANK-BILL-001
      responses:
        '200':
          description: >
            Draft created and workflow initiated. Response is deliberately minimal
            (Vision Bank already holds the full record on its own side). status
            reflects the outcome after workflow start (e.g. APPROVED for
            auto-approved requests, AWAITING_AUTHORIZATION if it needs a
            maker-checker approval).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceBillPaymentResponse'
              example:
                reference_id: VBANK-BILL-001
                id: 7A2E9F41-6C3D-4B8A-9E5F-2D1C8B4A7E90
                module_slug: bill-payment-type
                status: AWAITING_AUTHORIZATION
        '400':
          description: module_slug is missing, malformed, or not one of the currently supported types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionBankErrorResponse'
              example:
                statusCode: 400
                message: "Unsupported module_slug for reference transfers: some-unknown-slug"
                error: Bad Request
        '403':
          description: The caller's token lacks initiate permission on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionBankErrorResponse'
              example:
                statusCode: 403
                message: Forbidden
                error: Forbidden

  /api/v2/bill-payments/refunds/work-flow-process:
    post:
      tags: [Reference MOI Refund Workflow]
      summary: Start MOI Refund Workflow
      description: >
        Starts the approval workflow for an MOI refund consent created by Vision Bank. AION fetches
        the consent by reference_id and starts the workflow. A reference_id can start only one
        refund. X-Access-Token token is a trusted Forgerock token (Vision Bank) which is user JWT
        received from API Gateway.
      operationId: startMoiRefundWorkflow
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAccessToken'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequesterLang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMoiRefundRequest'
            example:
              module_slug: moi-refund
              reference_id: 55555555-5555-4555-8555-555555555555
      responses:
        '201':
          description: Refund request created and workflow started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartMoiRefundResponse'
              examples:
                awaitingApproval:
                  summary: Needs approval
                  value:
                    reference_id: 55555555-5555-4555-8555-555555555555
                    id: 8FF53AF0-D149-4B3B-81C1-2455FC08ED2B
                    module_slug: moi-refund
                    status: AWAITING_AUTHORIZATION
                    process_status: ACTIVATION_PENDING
                singleOwnerExecuted:
                  summary: Single owner - refund executed
                  value:
                    reference_id: 55555555-5555-4555-8555-555555555555
                    id: 8FF53AF0-D149-4B3B-81C1-2455FC08ED2B
                    module_slug: moi-refund
                    status: APPROVED
                    process_status: ACTIVATION_COMPLETED
                    transaction_id: RF-55555555
                singleOwnerFailed:
                  summary: Single owner - refund execution failed
                  value:
                    reference_id: 55555555-5555-4555-8555-555555555555
                    id: 8FF53AF0-D149-4B3B-81C1-2455FC08ED2B
                    module_slug: moi-refund
                    status: REJECTED
                    process_status: ACTIVATION_FAILED
        '400':
          description: Corporate limits are not configured for the company (`name` = `CORPORATE_LIMIT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoiRefundErrorResponse'
              example:
                statusCode: 400
                name: CORPORATE_LIMIT_NOT_FOUND
                errors:
                  - name: CORPORATE_LIMIT_NOT_FOUND
                    message: Corporate Limit Not Found
                timestamp: '2026-10-25T09:00:00.000Z'
                path: /rubix/api/v2/bill-payments/refunds/work-flow-process
        '401':
          description: Missing or invalid user token.
        '403':
          $ref: '#/components/responses/MoiRefundForbidden'
        '409':
          description: >
            The reference_id was already used, or another refund for the same payment is pending
            approval or approved. errors.message says which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoiRefundErrorResponse'
              examples:
                referenceAlreadyUsed:
                  summary: Same reference_id sent again
                  value:
                    statusCode: 409
                    name: ConflictException
                    errors:
                      statusCode: 409
                      message: This refund request is already pending approval (reference_id 55555555-5555-4555-8555-555555555555)
                      error: Conflict
                    timestamp: '2026-10-25T09:00:00.000Z'
                    path: /rubix/api/v2/bill-payments/refunds/work-flow-process
                paymentAlreadyRefunding:
                  summary: Another refund for the same payment exists
                  value:
                    statusCode: 409
                    name: ConflictException
                    errors:
                      statusCode: 409
                      message: A refund for this payment is already pending approval (reference_id 44444444-4444-4444-8444-444444444444)
                      error: Conflict
                    timestamp: '2026-10-25T09:00:00.000Z'
                    path: /rubix/api/v2/bill-payments/refunds/work-flow-process
        '422':
          description: >
            The refund amount exceeds the corporate's remaining daily limit
            (name = CORPORATE_DAILY_TRANSACTION_LIMIT_EXCEEDED), or the request body is invalid
            (name = INPUT_VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoiRefundErrorResponse'
              examples:
                limitExceeded:
                  summary: Corporate daily limit exceeded
                  value:
                    statusCode: 422
                    name: CORPORATE_DAILY_TRANSACTION_LIMIT_EXCEEDED
                    errors:
                      - name: CORPORATE_DAILY_TRANSACTION_LIMIT_EXCEEDED
                        message: You have already exceeded corporate daily transaction limit i-e 500000
                        dynamicFields:
                          limit: 500000
                    timestamp: '2026-10-25T09:00:00.000Z'
                    path: /rubix/api/v2/bill-payments/refunds/work-flow-process
                invalidBody:
                  summary: Invalid request body
                  value:
                    statusCode: 422
                    name: INPUT_VALIDATION_ERROR
                    errors:
                      - name: MODULE_SLUG_ISIN
                        message: 'module_slug must be one of the following values: moi-refund'
                        developerMessage: 'module_slug must be one of the following values: moi-refund'
                        field: module_slug
                        value: moi-payment
                    timestamp: '2026-10-25T09:00:00.000Z'
                    path: /rubix/api/v2/bill-payments/refunds/work-flow-process

  /api/v2/bill-payments/refunds/{reference_id}/workflow-status:
    get:
      tags: [Reference MOI Refund Workflow]
      summary: Get MOI Refund Workflow Status
      description: >
        AION's current status for the refund started with this reference_id, for the user's company.
        If no refund exists, the response is HTTP 200 with status NONE.
      operationId: getMoiRefundWorkflowStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAccessToken'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequesterLang'
        - name: reference_id
          in: path
          required: true
          description: The consent id the refund was started with.
          schema:
            type: string
          example: 55555555-5555-4555-8555-555555555555
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoiRefundWorkflowStatusResponse'
              examples:
                awaitingApproval:
                  summary: Pending approval
                  value:
                    reference_id: 55555555-5555-4555-8555-555555555555
                    module_slug: moi-refund
                    id: 8FF53AF0-D149-4B3B-81C1-2455FC08ED2B
                    status: AWAITING_AUTHORIZATION
                    process_status: ACTIVATION_PENDING
                    in_review: true
                approved:
                  summary: Approved - refund executed
                  value:
                    reference_id: 55555555-5555-4555-8555-555555555555
                    module_slug: moi-refund
                    id: 8FF53AF0-D149-4B3B-81C1-2455FC08ED2B
                    status: APPROVED
                    process_status: ACTIVATION_COMPLETED
                    in_review: false
                rejectedByApprover:
                  summary: Rejected by an approver
                  value:
                    reference_id: 55555555-5555-4555-8555-555555555555
                    module_slug: moi-refund
                    id: 8FF53AF0-D149-4B3B-81C1-2455FC08ED2B
                    status: REJECTED
                    process_status: ACTIVATION_PENDING
                    in_review: false
                executionFailed:
                  summary: Approved, but refund execution failed
                  value:
                    reference_id: 55555555-5555-4555-8555-555555555555
                    module_slug: moi-refund
                    id: 8FF53AF0-D149-4B3B-81C1-2455FC08ED2B
                    status: REJECTED
                    process_status: ACTIVATION_FAILED
                    in_review: false
                notFound:
                  summary: No refund for this reference_id
                  value:
                    reference_id: 55555555-5555-4555-8555-555555555555
                    module_slug: moi-refund
                    id: null
                    status: NONE
                    process_status: null
                    in_review: false
        '401':
          description: Missing or invalid user token.
        '403':
          $ref: '#/components/responses/MoiRefundForbidden'

  /v1/user/access-profile-context:
    get:
      tags: [User Access Profile]
      summary: Fetch User Access Profile
      description: Retrieves detailed user profile along with assigned roles, active modules, and granular permissions.
      operationId: getUserAccessProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAccessToken'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequesterLang'
      responses:
        '200':
          description: Successfully retrieved user profile details.
          content:
