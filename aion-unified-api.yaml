  /api/v1/orchestration/sme-validations:
    get:
      tags: [Corporate Validations Orchestration]
      summary: Check corporate eligibility and fetch transfer limits in one call
      description: >
        Returns whether the caller is eligible to initiate a request and, if
        eligible and applicable, the caller's current transfer limits for
        `module_slug`.

        If the caller is eligible, `limits` contains the limit details — unless
        `module_slug` has no limits concept (e.g. a beneficiary module), in which
        case `limits` is simply `null` with no error. Fetching limits is otherwise
        best-effort: if that lookup fails, the response is still `200` with
        `limits: null` and a `limitsError` string describing the failure, since
        eligibility — the authoritative result — was already determined.

        If the caller is not eligible, `limits` is `null` and no further detail is
        surfaced.

        If eligibility cannot be determined at all, an error response is returned
        instead — see the error response below.

        **MOI refund (`module_slug=moi-refund`):** pass the optional
        `end_to_end_identification` of the original payment. When the caller is eligible, AION
        also checks whether the company already has a refund for that payment. If it does, the
        response is `eligible: false` with `reason` = `REFUND_ALREADY_IN_REVIEW` (pending approval)
        or `REFUND_ALREADY_COMPLETED` (approved), and `existing_request`. A rejected or failed
        refund does not block a new one.
      operationId: getCorporateValidations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAccessToken'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XRequesterLang'
        - name: module_slug
          in: query
          description: Identifies the transfer module to check eligibility and limits for.
          required: true
          schema:
            type: string
            enum:
              - transfer_management-internal_bank_transfer
              - transfer_management-domestic_bank_transfer
              - beneficiary_management
              - term_deposit
              - moi-refund
          example: transfer_management-domestic_bank_transfer
        - name: end_to_end_identification
          in: query
          required: false
          description: >
            MOI refund only - end-to-end id of the original MOI payment. Enables the duplicate
            refund check.
          schema:
            type: string
          example: E2E-20261009-123456
      responses:
        '200':
          description: >
            Returned whenever an eligibility determination could be made,
            regardless of the result. See the examples below.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateValidationsResponse'
              examples:
                eligible:
                  summary: Eligible — limits fetched successfully
                  value:
                    eligible: true
                    reason: APPROVER_AVAILABLE
                    limits:
                      customer_id: 8A7F6E5D-4C3B-2A19-8E7F-6D5C4B3A2910
                      module_id: 6C9D1A2B-3E4F-4A5B-8C7D-6E5F4A3B2C1D
                      utilised_limit_date: '2026-10-25'
                      min_limit: 0
                      max_limit: 500000
                      per_transaction_limit: 100000
                      transaction_limit: 100000
                      utilised_amount: 175000
                      utilised_no_transactions: 12
                      amount_left: 325000
                blocked:
                  summary: Not eligible — limits call skipped entirely
                  value:
                    eligible: false
                    reason: NO_INITIATE_PERMISSION
                    limits: null
                eligibleNoLimits:
                  summary: Eligible, but limits don't apply to this module_slug (e.g. beneficiary)
                  value:
                    eligible: true
                    reason: APPROVER_AVAILABLE
                    limits: null
                limitsFailed:
                  summary: Eligible, but the best-effort limits fetch failed
                  value:
                    eligible: true
                    reason: APPROVER_AVAILABLE
                    limits: null
                    limitsError: "Request failed with status code 422"
                moiRefundInReview:
                  summary: MOI refund — a refund for this payment is pending approval
                  value:
                    eligible: false
                    reason: REFUND_ALREADY_IN_REVIEW
                    limits: null
                    existing_request:
                      reference_id: 55555555-5555-4555-8555-555555555555
                      id: 8FF53AF0-D149-4B3B-81C1-2455FC08ED2B
                      status: AWAITING_AUTHORIZATION
                      process_status: ACTIVATION_PENDING
                moiRefundCompleted:
                  summary: MOI refund — a refund for this payment is already approved
                  value:
                    eligible: false
                    reason: REFUND_ALREADY_COMPLETED
                    limits: null
                    existing_request:
                      reference_id: 55555555-5555-4555-8555-555555555555
                      id: 8FF53AF0-D149-4B3B-81C1-2455FC08ED2B
                      status: APPROVED
                      process_status: ACTIVATION_COMPLETED
        '4XX':
          description: Eligibility could not be determined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateValidationsErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT bearer token, required on every operation in this document. What the
        token represents differs by endpoint: for the Reference Beneficiary/Transfer
        endpoints it is a trusted external system's own token (e.g. Vision Bank);
        for User Access Profile, System Audit Logs, and Corporate Validations
        Orchestration it is the standard AION session token used by any other
        channel. See each operation's description for specifics.

  parameters:
    XAccessToken:
      name: X-Access-Token
      in: header
      required: true
      description: >
        Downstream access token, forwarded as-is to internal federated services.
      schema:
        type: string
    XCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Correlation/trace id propagated across services for request tracing. Recommended on every call.
      schema:
        type: string
        format: uuid
    XDeviceId:
      name: X-Device-ID
      in: header
      required: false
      description: Identifier of the calling device, where applicable.
      schema:
        type: string
    XRequesterLang:
      name: X-Requester-Lang
      in: header
      required: false
      description: Requester's preferred language (`en` / `ar`), used to localize error messages.
      schema:
        type: string
        enum: [en, ar]
        default: en

  responses:
    MoiRefundForbidden:
      description: The user is not allowed to perform this action on `moi-refund`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MoiRefundErrorResponse'
          example:
            statusCode: 403
            name: ForbiddenException
            errors:
              statusCode: 403
              message: Forbidden resource
              error: Forbidden
            timestamp: '2026-10-25T09:00:00.000Z'
            path: /rubix/api/v2/bill-payments/refunds/work-flow-process

  schemas:
    # --- Reference Beneficiary / Reference Transfer (Vision Bank) ---
    ReferenceBeneficiaryInitiateRequest:
      type: object
      required: [module_slug, reference_id]
      properties:
        module_slug:
          type: string
          description: Identifies the beneficiary type.
          enum:
            - beneficiary_management-local_beneficiary
            - beneficiary_management-internal_beneficiary
          example: beneficiary_management-local_beneficiary
        reference_id:
          type: string
          description: Vision Bank's own reference id for this beneficiary.
          example: VBANK-BENE-12345

    ReferenceBeneficiaryResponse:
      type: object
      properties:
        reference_id:
          type: string
          description: The external system's own reference id, echoed back from the request.
          example: VBANK-BENE-12345
        id:
          type: string
          format: uuid
          description: AION beneficiary request id created for this reference_id.
        module_slug:
          type: string
          description: module_slug the request was resolved against, echoed back from the request.
          example: beneficiary_management-local_beneficiary
        status:
          type: string
          enum: [DRAFT, AWAITING_AUTHORIZATION, APPROVED, REJECTED]
          description: >
            Current maker-checker application status after workflow initiation.
            No IVR/PENDING_IVR state occurs via this API — no OTP or IVR is
            required for any beneficiary type.

    ReferenceBeneficiaryActivationStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]
          description: >
            Final activation decision from the external system, sent once it has made its own
            final decision — however it gets there (IVR or otherwise) is entirely on the
            external system's side; AION doesn't manage or model that step.
          example: APPROVED

    ReferenceBeneficiaryActivationStatusResponse:
      type: object
      properties:
        reference_id:
          type: string
          description: The external system's own reference id, echoed back from the request.
          example: VBANK-BENE-LOCAL-001
        id:
          type: string
          format: uuid
          description: AION beneficiary request id.
        status:
          type: string
          enum: [APPROVED, REJECTED]
          description: The finalized status, echoed back from the request.

    ReferenceBeneficiaryWorkflowStatusResponse:
      type: object
      properties:
        reference_id:
          type: string
          description: The external system's own reference id, echoed back from the request.
          example: VBANK-BENE-LOCAL-001
        id:
          type: string
          format: uuid
          description: AION beneficiary request id.
        application_status:
          type: string
          enum: [DRAFT, AWAITING_AUTHORIZATION, APPROVED, REJECTED]
          description: AION's maker-checker application status.
        process_status:
          type: string
          description: >
            Secondary status tracking activity beyond the maker-checker decision itself — e.g.
            ACTIVATION_PENDING means AION has approved but is awaiting the external system's own
            final activation decision (see PUT activation-status). Not an exhaustive list: more
            values will be added over time as new flows are onboarded (deletion/update requests
            follow the same *_PENDING pattern), so treat this as an open set rather than a fixed
            enum when validating responses.
          enum: [ACTIVATION_PENDING, DELETION_PENDING, UPDATION_PENDING]
          example: ACTIVATION_PENDING
          nullable: true

    ReferenceTransferInitiateRequest:
      type: object
      required: [module_slug, reference_id]
      properties:
        module_slug:
          type: string
          description: Identifies the transfer type.
          enum:
            - transfer_management-domestic_bank_transfer
            - transfer_management-one_time_transfer
          example: transfer_management-domestic_bank_transfer
        reference_id:
          type: string
          description: Vision Bank's own reference id for this transfer.
          example: VBANK-TRANS-54321

    ReferenceTransferResponse:
      type: object
      properties:
        reference_id:
          type: string
          description: The external system's own reference id, echoed back from the request.
          example: VBANK-TRANS-54321
        id:
          type: string
          format: uuid
          description: AION money transfer request id created for this reference_id.
        module_slug:
          type: string
          description: module_slug the request was resolved against, echoed back from the request.
          example: transfer_management-domestic_bank_transfer
        status:
          type: string
          enum: [DRAFT, AWAITING_AUTHORIZATION, APPROVED, REJECTED]
          description: Current maker-checker application status after workflow initiation.

    ReferenceBillPaymentInitiateRequest:
      type: object
      required: [module_slug, reference_id]
      properties:
        module_slug:
          type: string
          description: Identifies the bill payment type.
          example: bill-payment-type
        reference_id:
          type: string
          description: Vision Bank's own reference id for this bill payment.
          example: VBANK-BILL-12345

    ReferenceBillPaymentResponse:
      type: object
      properties:
        reference_id:
          type: string
          description: The external system's own reference id, echoed back from the request.
          example: VBANK-BILL-12345
        id:
          type: string
          format: uuid
          description: AION bill payment request id created for this reference_id.
        module_slug:
          type: string
          description: module_slug the request was resolved against, echoed back from the request.
          example: bill-payment-type
        status:
          type: string
          enum: [DRAFT, AWAITING_AUTHORIZATION, APPROVED, REJECTED]
          description: Current maker-checker application status after workflow initiation.

    VisionBankErrorResponse:
      type: object
      description: Error envelope used by the Reference Beneficiary / Reference Transfer endpoints.
      properties:
        statusCode: { type: integer }
        message: { type: string }
        error: { type: string }

    # --- MOI Refund (Vision Bank) ---
    StartMoiRefundRequest:
      type: object
      required: [module_slug, reference_id]
      properties:
        module_slug:
          type: string
          enum: [moi-refund]
        reference_id:
          type: string
          description: Vision Bank's refund consent id.
          example: 55555555-5555-4555-8555-555555555555

    StartMoiRefundResponse:
      type: object
      required: [reference_id, id, module_slug, status, process_status]
      properties:
        reference_id:
          type: string
          description: The consent id from the request.
        id:
          type: string
          description: AION refund request id.
        module_slug:
          type: string
          example: moi-refund
        status:
          type: string
          enum: [AWAITING_AUTHORIZATION, APPROVED, REJECTED]
          description: APPROVED / REJECTED only for a single-owner company (refund executed in this call).
        process_status:
          type: string
          enum: [ACTIVATION_PENDING, ACTIVATION_COMPLETED, ACTIVATION_FAILED]
        transaction_id:
          type: string
          description: Vision Bank's refund id. Present only when the refund was executed in this call.

    MoiRefundWorkflowStatusResponse:
      type: object
      required: [reference_id, module_slug, id, status, process_status, in_review]
      properties:
        reference_id:
          type: string
        module_slug:
          type: string
          example: moi-refund
        id:
          type: string
          nullable: true
          description: AION refund request id. null when no refund exists.
        status:
          type: string
          enum: [NONE, AWAITING_AUTHORIZATION, APPROVED, REJECTED]
          description: >
            AWAITING_AUTHORIZATION - pending approval. APPROVED - approved and refund executed.
            REJECTED - rejected by an approver, or refund execution failed (process_status =
            ACTIVATION_FAILED). NONE - no refund for this reference_id.
        process_status:
          type: string
          nullable: true
          enum: [ACTIVATION_PENDING, ACTIVATION_COMPLETED, ACTIVATION_FAILED]
        in_review:
          type: boolean
          description: true while the refund is pending approval.

    MoiRefundExistingRequest:
      type: object
      description: >
        The existing refund for the same payment. Present only for REFUND_ALREADY_IN_REVIEW /
        REFUND_ALREADY_COMPLETED.
      properties:
        reference_id:
          type: string
          description: Consent id the existing refund was started with.
        id:
          type: string
          description: AION refund request id.
        status:
          type: string
          enum: [DRAFT, AWAITING_AUTHORIZATION, APPROVED]
        process_status:
          type: string
          nullable: true
          enum: [ACTIVATION_PENDING, ACTIVATION_COMPLETED]

    MoiRefundErrorResponse:
      type: object
      description: Error envelope returned by the MOI Refund endpoints.
      required: [statusCode, name, errors, timestamp, path]
      properties:
        statusCode:
          type: integer
        name:
          type: string
          description: Error code - use it to identify the error.
        errors:
          description: Error details. `message` holds the error text (in the language of `X-Requester-Lang`).
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
                properties:
                  name:
                    type: string
                  message:
                    type: string
            - type: object
              additionalProperties: true
              properties:
                message:
                  type: string
        errorMessageComment:
          type: string
          description: Error text in English, when available.
        errorMessageCommentAr:
          type: string
          description: Error text in Arabic, when available.
        timestamp:
          type: string
          format: date-time
        path:
          type: string

    # --- User Access Profile ---
    UserAccessResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "DCACE77B-1C27-4F09-8535-E97EB7B5D372"
        user_name:
          type: string
          example: "omerCSAnew"
        email:
          type: string
          format: email
          example: "testom@gmail.com"
        user_type:
          type: string
          example: "EXTERNAL"
        is_super_admin:
          type: boolean
          example: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/Module'
        permissions:
          type: array
          items:
            type: string
          example:
            - "approve:system-access-policy"
            - "initiate:system-access-policy"
        status:
          type: string
          example: "ACTIVE"
        has_full_access:
          type: boolean
          example: true
        is_corporate_super_admin:
          type: boolean
          example: false

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "B158928D-3C71-4CFC-AA9C-4B167CCDBC58"
        name:
          type: string
          example: "CSA Full Access"
        role_slug:
          type: string
          example: "CSA-full-access"
        status:
          type: string
          example: "ACTIVE"

    Module:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "FD6FC89F-5E10-4F66-B5B3-A977E6638DB5"
        name:
          type: string
          example: "Merchant Statement"
        name_ar:
          type: string
          example: "كشف التاجر"
        slug:
          type: string
          example: "service-request-merchant-statement"
        module_category:
          type: string
          example: "FINANCIAL"
        is_limit_enabled:
          type: boolean
          example: true
        is_authority_matrix_enabled:
          type: boolean
          example: true
        applications:
          type: array
          items:
